name: cron-probe

# 临时探针：验证 fork 仓库上的 schedule 事件是否真的被调度
# 用途：若 10 分钟内没有产生 event=schedule 的运行，则说明 fork 的 cron 不可用
# 验证完成后请删除本文件

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 打印触发信息
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
